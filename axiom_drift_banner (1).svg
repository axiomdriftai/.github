<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Axiom Drift AI — Where interaction becomes structure</title>

  <!-- Background: parchment with subtle radial warm glow top-left -->
  <defs>
    <radialGradient id="glow" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ede6d6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f4f0e8" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="warmspot" cx="8%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#e8dfc8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f4f0e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base parchment -->
  <rect width="1200" height="280" fill="url(#glow)"/>
  <!-- Warm radial overlay top-left -->
  <rect width="1200" height="280" fill="url(#warmspot)"/>

  <!-- Subtle frame line -->
  <rect x="28" y="20" width="1144" height="240" fill="none" stroke="#28261614" stroke-width="1"/>

  <!-- Decorative left accent bar -->
  <rect x="64" y="80" width="2" height="120" fill="#455241" opacity="0.35"/>

  <!-- AXIOM DRIFT — main wordmark -->
  <text
    x="600" y="138"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="400"
    letter-spacing="18"
    fill="#1f1d19"
    text-anchor="middle"
    dominant-baseline="middle"
  >AXIOM DRIFT</text>

  <!-- Thin rule under wordmark -->
  <line x1="340" y1="162" x2="860" y2="162" stroke="#455241" stroke-width="0.8" opacity="0.4"/>

  <!-- Tagline -->
  <text
    x="600" y="190"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="17"
    font-weight="400"
    letter-spacing="3"
    fill="#5c564e"
    text-anchor="middle"
    font-style="italic"
  >where interaction becomes structure</text>

  <!-- Bottom right — subtle URL -->
  <text
    x="1136" y="248"
    font-family="Arial, sans-serif"
    font-size="11"
    letter-spacing="1.5"
    fill="#5c564e"
    text-anchor="end"
    opacity="0.55"
  >axiomdrift.ai</text>

  <!-- Decorative right accent bar -->
  <rect x="1134" y="80" width="2" height="120" fill="#8a775c" opacity="0.25"/>

</svg>
